<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Contact</title>
    <link rel="stylesheet" href="../css/contact.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="../Js/contact.js" defer></script>
    <script src="../Js/layout.js" defer></script>
</head>

<body>
<main>
    <h1 class="page-title">Контакт</h1>
    <div class="contact-wrapper">

        <!-- LEFT SIDE -->
        <div class="contact-left">
            <form class="contact-form">
                <label for="name">Име</label>
                <input type="text" id="name" name="name" placeholder="Вашето име">

                <label for="email">Е-пошта</label>
                <input type="email" id="email" name="email" placeholder="Вашата е-пошта">

                <label for="subject">Тема</label>
                <input type="text" id="subject" name="subject" placeholder="Вашата тема">

                <label for="message">Порака</label>
                <textarea id="message" name="message" rows="6" placeholder="Вашата порака"></textarea>

                <button type="submit">Прати</button>
            </form>
        </div>

        <!-- RIGHT SIDE -->
        <div class="contact-right">
            <div id="map"></div>

            <div class="contact-info">
                <p><i class="fa-solid fa-location-dot"></i> Адреса: Булевар Свети Климент Охридски MK, Skopje 1000</p>
                <p><i class="fa-solid fa-phone"></i> Телефон: <a href="tel:+38970123456">02 313 6359</a></p>
                <p><i class="fa-solid fa-envelope"></i> Е-пошта: <a href="https://mail.google.com/mail/?view=cm&to=info@kladilnici.com" target="_blank" rel="noopener">info@kladilnici.com</a></p>
            </div>

        </div>

    </div>
</main>
</body>
</html>
